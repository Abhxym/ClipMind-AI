version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./rag/faiss_index:/app/rag/faiss_index
      - ./rag/chroma_db:/app/rag/chroma_db
      - ./pipeline:/app/pipeline
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  uploads:
  outputs:
